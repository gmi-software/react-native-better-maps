# Runs every scripted scenario and waits for the summary line.
#
# Build and launch the example with EXPO_PUBLIC_BENCHMARK=1 first, then:
#   maestro test example/maestro/benchmark-run-all.yaml
# Results are printed by the app as `[benchmark] {...}` lines (see docs/benchmarks.md).
appId: com.nitromaps.example
---
- launchApp
- extendedWaitUntil:
    visible:
      id: 'benchmark-run-all'
    timeout: 60000
- tapOn:
    id: 'benchmark-run-all'
# The summary reads "<passed>/<n> passed" once every scenario has a result,
# where n counts the scenarios that run on this platform: the four sprite
# scenarios are Apple Maps only, so Android runs 16 of the 20. The last result
# row can sit below the fold of the results list.
- extendedWaitUntil:
    visible:
      text: '.*/16 passed'
    timeout: 300000
