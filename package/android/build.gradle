buildscript {
    ext.kotlinVersion = '2.1.0'

    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:${kotlinVersion}"
    }
}

def reactNativeArchitectures() {
    def value = rootProject.getProperties().get("reactNativeArchitectures")
    return value ? value.split(",") : ["armeabi-v7a", "x86", "x86_64", "arm64-v8a"]
}

def getExtOrDefault(name) {
    return rootProject.ext.has(name) ? rootProject.ext.get(name) : project.properties["NitroMaps_" + name]
}

def getExtOrIntegerDefault(name) {
    return rootProject.ext.has(name) ? rootProject.ext.get(name) : (project.properties["NitroMaps_" + name]).toInteger()
}

apply plugin: 'com.android.library'
apply plugin: 'org.jetbrains.kotlin.android'
apply from: '../nitrogen/generated/android/NitroMaps+autolinking.gradle'

// 'com.facebook.react' is deliberately NOT applied here.
//
// Its only library-scoped job is React Native's codegen, and this module has no
// TurboModule or Fabric specs to codegen — nitrogen generates the native bindings
// into ../nitrogen/generated instead. Worse, the plugin always runs codegen for a
// library and defaults its scan root to the Gradle project's parent, and the schema
// CLI globs that root without excluding node_modules. So it scanned all of package/,
// picked up every Native*/*NativeComponent spec under package/node_modules — React
// Native's own plus those of any library hoisted there, e.g. reanimated — and
// compiled 75 foreign classes into our AAR. They then exist twice on the release
// dex path and D8 fails :app:mergeDexRelease (#123).
//
// The app's own 'com.facebook.react' reaches this module anyway: configureRepositories,
// configureDependencies (which resolves the versionless react-android below),
// configureBuildConfigFieldsForLibraries and configureNamespaceForLibraries all run
// over rootProject.allprojects.

android {
    namespace 'com.margelo.nitro.nitromaps'

    ndkVersion getExtOrDefault("ndkVersion")
    compileSdkVersion getExtOrIntegerDefault("compileSdkVersion")

    defaultConfig {
        minSdkVersion getExtOrIntegerDefault("minSdkVersion")
        targetSdkVersion getExtOrIntegerDefault("targetSdkVersion")

        externalNativeBuild {
            cmake {
                cppFlags "-frtti -fexceptions -Wall -fstack-protector-all"
                arguments "-DANDROID_STL=c++_shared"
                abiFilters (*reactNativeArchitectures())
            }
        }
    }

    externalNativeBuild {
        cmake {
            path "CMakeLists.txt"
        }
    }

    buildFeatures {
        prefab true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    sourceSets {
        main {
            java.srcDirs = [
                'src/main/java',
                '../nitrogen/generated/android/kotlin',
            ]
            kotlin.srcDirs = ['src/main/kotlin']
        }
    }
}

dependencies {
    implementation 'com.facebook.react:react-android'
    implementation project(':react-native-nitro-modules')
    implementation 'com.google.android.gms:play-services-maps:19.0.0'
    implementation 'com.google.maps.android:android-maps-utils:3.8.2'
    testImplementation 'junit:junit:4.13.2'
}
